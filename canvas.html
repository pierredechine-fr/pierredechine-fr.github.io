<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Model Gallery + Materials</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    /* UI PANEL */
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 20;
    }

    /* GALLERY */
    #gallery {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .thumb {
      width: 100px;
      height: 80px;
      border-radius: 6px;
      border: 2px solid #ddd;
      cursor: pointer;
      object-fit: cover;
      background: #eee;
    }

    .thumb:hover {
      border-color: #111;
    }

    #loading {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 6px 10px;
      border-radius: 6px;
      z-index: 30;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="loading">Loading...</div>

<!-- ✅ RESTORED UI -->
<div id="ui">
  <label>Material:</label>
  <select id="materialSelect">
    <option value="wood">Wood</option>
    <option value="marble">Marble</option>
    <option value="black">Black Stone</option>
  </select>
</div>

<div id="gallery"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

let scene, camera, renderer, controls;
let currentModel = null;
let tableTopMesh = null;

const textureLoader = new THREE.TextureLoader();

const models = [
  { name: "Table 1", url: "./assets/3dmodels/table.glb" },
  { name: "Table 2", url: "./assets/3dmodels/classic_table.glb" },
];

init();
createGallery();
loadModel(models[0].url);
animate();

function init() {

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f2f2);

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(5, 10, 5);
  scene.add(light);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ✅ MATERIAL SWITCH
  document.getElementById("materialSelect").addEventListener("change", (e) => {
    changeMaterial(e.target.value);
  });
}

function loadModel(url) {

  const loader = new GLTFLoader();

  loader.load(url, (gltf) => {

    if (currentModel) scene.remove(currentModel);

    currentModel = gltf.scene;
    scene.add(currentModel);

    // center
    const box = new THREE.Box3().setFromObject(currentModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    currentModel.position.sub(center);

    const max = Math.max(size.x, size.y, size.z);
    const dist = max * 1.6;

    camera.position.set(dist, dist * 0.8, dist);
    camera.lookAt(0, 0, 0);

    controls.target.set(0, 0, 0);

    // find tabletop
    tableTopMesh = null;
    currentModel.traverse((c) => {
      if (c.isMesh) {
        if (c.name.toLowerCase().includes("top")) {
          tableTopMesh = c;
        }
      }
    });

    if (!tableTopMesh) {
      currentModel.traverse((c) => {
        if (c.isMesh && !tableTopMesh) tableTopMesh = c;
      });
    }

    document.getElementById("loading").style.display = "none";
  });
}

function changeMaterial(type) {

  if (!tableTopMesh) return;

  let mat;

  if (type === "wood") {
    const tex = textureLoader.load("./assets/textures/wood.jpg");
    tex.colorSpace = THREE.SRGBColorSpace;

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.85
    });
  }

  if (type === "marble") {
    const tex = textureLoader.load("./assets/textures/marble.jpg");
    tex.colorSpace = THREE.SRGBColorSpace;

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.2,
      metalness: 0.05
    });
  }

  if (type === "black") {
    mat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.4,
      metalness: 0.6
    });
  }

  tableTopMesh.material = mat;
}

function createGallery() {

  const gallery = document.getElementById("gallery");
  const loader = new GLTFLoader();

  models.forEach((model) => {

    const img = document.createElement("img");
    img.className = "thumb";
    gallery.appendChild(img);

    loader.load(model.url, (gltf) => {

      const tempScene = new THREE.Scene();

      const obj = gltf.scene;
      tempScene.add(obj);

      tempScene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const light = new THREE.DirectionalLight(0xffffff, 2);
      light.position.set(5, 5, 5);
      tempScene.add(light);

      const tempCam = new THREE.PerspectiveCamera(50, 200/150, 0.1, 1000);

      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      obj.position.sub(center);

      const max = Math.max(size.x, size.y, size.z);
      const dist = max * 1.6;

      tempCam.position.set(dist, dist * 0.8, dist);
      tempCam.lookAt(0, 0, 0);

      const tempRenderer = new THREE.WebGLRenderer({ antialias: true });

      tempRenderer.setSize(200, 150);
      tempRenderer.render(tempScene, tempCam);

      img.src = tempRenderer.domElement.toDataURL();

    });

    img.addEventListener("click", () => {
      loadModel(model.url);
    });

  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
