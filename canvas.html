<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Table Configurator</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* UI panel */
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #bar-container {
      width: 300px;
      height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }

    #bar {
      width: 0%;
      height: 100%;
      background: #111;
      transition: width 0.2s ease;
    }
  </style>

  <!-- Import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<!-- Loading UI -->
<div id="loading-screen">
  <div id="loading-text">Loading 0%</div>
  <div id="bar-container">
    <div id="bar"></div>
  </div>
</div>

<!-- UI -->
<div id="ui">
  <label>Table Material:</label>
  <select id="materialSelect">
    <option value="wood">Wood</option>
    <option value="marble">Marble</option>
    <option value="black">Black Stone</option>
  </select>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

let scene, camera, renderer, controls;
let tableModel;
let tableTopMesh = null;

const textureLoader = new THREE.TextureLoader();

init();
animate();

function init() {

  // DOM loading elements
  const loadingScreen = document.getElementById("loading-screen");
  const loadingText = document.getElementById("loading-text");
  const bar = document.getElementById("bar");

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f2f2);

  // Camera
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);

  // Load GLB
  const loader = new GLTFLoader();

  loader.load(
    "./assets/3dmodels/classic_table.glb",

    function (gltf) {
      console.log("GLB loaded");

      tableModel = gltf.scene;
      scene.add(tableModel);

      // Center model
      const box = new THREE.Box3().setFromObject(tableModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      tableModel.position.sub(center);

      const maxAxis = Math.max(size.x, size.y, size.z);
      const scale = 2 / maxAxis;
      tableModel.scale.setScalar(scale);

      const box2 = new THREE.Box3().setFromObject(tableModel);
      const center2 = box2.getCenter(new THREE.Vector3());
      tableModel.position.sub(center2);

      controls.target.set(0, 0, 0);

      // Find tabletop mesh
      tableModel.traverse((child) => {
        if (child.isMesh) {
          if (child.name.toLowerCase().includes("top")) {
            tableTopMesh = child;
          }
        }
      });

      if (!tableTopMesh) {
        tableModel.traverse((c) => {
          if (c.isMesh && !tableTopMesh) tableTopMesh = c;
        });
      }

      // Hide loading screen
      loadingScreen.style.transition = "opacity 0.5s";
      loadingScreen.style.opacity = 0;
      setTimeout(() => loadingScreen.style.display = "none", 500);
    },

    function (xhr) {
      if (xhr.total) {
        const percent = (xhr.loaded / xhr.total) * 100;
        loadingText.innerText = `Loading ${percent.toFixed(0)}%`;
        bar.style.width = percent + "%";
      } else {
        loadingText.innerText = "Loading...";
      }
    },

    function (err) {
      console.error("GLB load error:", err);
      loadingText.innerText = "Failed to load model";
    }
  );

  // UI events
  document.getElementById("materialSelect").addEventListener("change", (e) => {
    changeMaterial(e.target.value);
  });

  window.addEventListener("resize", onResize);
}

function changeMaterial(type) {
  if (!tableTopMesh) return;

  let mat;

  if (type === "wood") {
    const tex = textureLoader.load("./assets/textures/wood.jpg");
    tex.colorSpace = THREE.SRGBColorSpace;

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.85
    });
  }

  if (type === "marble") {
    const tex = textureLoader.load("./assets/textures/marble.jpg");
    tex.colorSpace = THREE.SRGBColorSpace;

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.2,
      metalness: 0.05
    });
  }

  if (type === "black") {
    mat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.4,
      metalness: 0.6
    });
  }

  tableTopMesh.material = mat;
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
