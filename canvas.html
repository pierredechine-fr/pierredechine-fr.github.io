<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Table Configurator</title>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }

    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
    }
  </style>

  <!-- Import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="ui">
  <label>Table Material:</label>
  <select id="materialSelect">
    <option value="wood">Wood</option>
    <option value="marble">Marble</option>
    <option value="black">Black Stone</option>
  </select>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

let scene, camera, renderer, controls;
let tableModel;
let tableTopMesh = null;

const textureLoader = new THREE.TextureLoader();

init();
animate();

function init() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f2f2);

  // Camera
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Controls (🔥 drag to rotate)
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);

  // Load GLB
  const loader = new GLTFLoader();

  loader.load("./assets/3dmodels/classic_table.glb", (gltf) => {
    console.log("GLB loaded");

    tableModel = gltf.scene;
    scene.add(tableModel);

    // 🔥 CENTER MODEL PROPERLY
    const box = new THREE.Box3().setFromObject(tableModel);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    tableModel.position.sub(center); // move to origin

    // optional: auto scale to reasonable size
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 2 / maxAxis;
    tableModel.scale.setScalar(scale);

    // re-center after scaling
    const box2 = new THREE.Box3().setFromObject(tableModel);
    const center2 = box2.getCenter(new THREE.Vector3());
    tableModel.position.sub(center2);

    controls.target.set(0, 0, 0);

    // Find tabletop mesh
    tableModel.traverse((child) => {
      if (child.isMesh) {
        console.log("Mesh:", child.name);

        if (child.name.toLowerCase().includes("top")) {
          tableTopMesh = child;
        }
      }
    });

    // fallback
    if (!tableTopMesh) {
      tableModel.traverse((c) => {
        if (c.isMesh && !tableTopMesh) tableTopMesh = c;
      });
    }

  }, undefined, (err) => {
    console.error("GLB load error:", err);
  });

  // UI
  document.getElementById("materialSelect").addEventListener("change", (e) => {
    changeMaterial(e.target.value);
  });

  window.addEventListener("resize", onResize);
}

function changeMaterial(type) {
  if (!tableTopMesh) return;

  let mat;

  if (type === "wood") {
    const tex = textureLoader.load("./assets/textures/wood.jpg");

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.85
    });
  }

  if (type === "marble") {
    const tex = textureLoader.load("./assets/textures/marble.jpg");

    mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.2,
      metalness: 0.05
    });
  }

  if (type === "black") {
    mat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.4,
      metalness: 0.6
    });
  }

  tableTopMesh.material = mat;
}


function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  controls.update(); // 🔥 required for damping
  renderer.render(scene, camera);
}
</script>

</body>
</html>
